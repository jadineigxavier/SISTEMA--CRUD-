<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRUD Genérico | Sistema de Itens</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="container">
    <header>
      <h1>📦 Sistema de Itens</h1>
      <p class="subtitle">CRUD genérico — Flask + SQLAlchemy</p>
    </header>

    <section class="card">
      <h2 id="form-title">Novo Pedido</h2>
      <form id="item-form">
        <input type="hidden" id="item-id" />

        <div class="field">
          <label for="nome">Nome *</label>
          <input type="text" id="nome" placeholder="Ex: José da Silva" required />
        </div>

        <div class="field">
          <label for="descricao">Descrição do Pedido</label>
          <input type="text" id="descricao" placeholder="Ex: Descrição do pedido" />
        </div>

        <div class="field">
          <label for="quantidade">Quantidade</label>
          <input type="number" id="quantidade" value="0" min="0" />
        </div>

        <div class="actions">
          <button type="submit" id="submit-btn">Salvar</button>
          <button type="button" id="cancel-btn" class="secondary" hidden>Cancelar edição</button>
        </div>
      </form>
    </section>

    <section class="card">
      <div class="list-header">
        <h2>Itens cadastrados</h2>
        <input type="search" id="search" placeholder="🔎 Buscar por nome..." />
      </div>

      <table id="itens-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Descrição</th>
            <th>Qtd.</th>
            <th>Atualizado em</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="itens-body">
          <!-- preenchido via JS -->
        </tbody>
      </table>

      <p id="empty-msg" hidden>Nenhum item cadastrado ainda.</p>
    </section>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
